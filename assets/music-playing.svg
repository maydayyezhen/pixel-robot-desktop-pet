<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32" shape-rendering="crispEdges">
  <style>
    .shadow { fill: #152126; }
    .bar { fill: #4fe8d8; }
    @keyframes b1 { 0%,100% { height: 8px; y: 20px; } 50% { height: 22px; y: 6px; } }
    @keyframes b2 { 0%,100% { height: 18px; y: 10px; } 50% { height: 10px; y: 18px; } }
    @keyframes b3 { 0%,100% { height: 12px; y: 16px; } 50% { height: 26px; y: 2px; } }
    @keyframes b4 { 0%,100% { height: 24px; y: 4px; } 50% { height: 9px; y: 19px; } }
    .a { animation: b1 0.7s steps(4, end) infinite; }
    .b { animation: b2 0.7s steps(4, end) infinite; }
    .c { animation: b3 0.7s steps(4, end) infinite; }
    .d { animation: b4 0.7s steps(4, end) infinite; }
  </style>
  <rect class="shadow a" x="7" y="22" width="6" height="8"/>
  <rect class="shadow b" x="18" y="12" width="6" height="18"/>
  <rect class="shadow c" x="29" y="18" width="6" height="12"/>
  <rect class="shadow d" x="40" y="6" width="6" height="24"/>
  <rect class="bar a" x="5" y="20" width="6" height="8"/>
  <rect class="bar b" x="16" y="10" width="6" height="18"/>
  <rect class="bar c" x="27" y="16" width="6" height="12"/>
  <rect class="bar d" x="38" y="4" width="6" height="24"/>
</svg>
